<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>納品報告</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <meta name="theme-color" content="#0e2440">
  <meta name="application-name" content="納品報告">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="納品報告">
  <meta name="format-detection" content="telephone=no">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #edf2f5;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #appFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #edf2f5;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #edf2f5;
      color: #183153;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      font-size: 18px;
      font-weight: 800;
      transition: opacity .2s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="loading">
    納品報告を開いています…
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwQ81_BAcdPaeBqWhqqcQchRWUXlLzy2FztJmYTTkCudGQjMDRqhSLSN0BwMjsgA068/exec"
    title="納品報告"
    allow="camera; clipboard-write"
  ></iframe>

  <script>
    const frame =
      document.getElementById('appFrame');

    const loading =
      document.getElementById('loading');

    frame.addEventListener(
      'load',
      function() {
        window.setTimeout(
          function() {
            loading.classList.add('hidden');
          },
          250
        );
      }
    );

    if ('serviceWorker' in navigator) {
      window.addEventListener(
        'load',
        function() {
          navigator.serviceWorker
            .register('./service-worker.js')
            .catch(function(error) {
              console.log(
                'Service Worker registration failed:',
                error
              );
            });
        }
      );
    }
  </script>

</body>
</html>
